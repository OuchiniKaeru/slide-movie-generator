<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene 004 - Animated Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .player-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .player-title {
      font-size: 18px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* 16:9 Canvas Stage */
    .stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at 50% 20%, #0f1d3a 0%, #060913 70%);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 80px rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Ambient Background Lights */
    .glow-orb-1 {
      position: absolute;
      top: -10%;
      left: 30%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .glow-orb-2 {
      position: absolute;
      bottom: -15%;
      right: 20%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      animation: floatOrb 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.15); }
    }

    /* Grid overlay pattern */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Slide Content Container (Responsive virtual 1920x1080 coordinate system) */
    .scene-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5% 6%;
      z-index: 2;
    }

    /* Elements */
    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: clamp(10px, 1.1vw, 15px);
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 2%;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-heading {
      font-size: clamp(20px, 2.7vw, 42px);
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4%;
      max-width: 900px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(12px, 2vw, 28px);
      width: 100%;
      max-width: 1100px;
      margin-bottom: 3.5%;
    }

    .glass-card {
      position: relative;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: clamp(16px, 2.2vw, 32px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.8s cubic-bezier(0.34, 1.35, 0.64, 1);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0.8;
      box-shadow: 0 0 12px var(--accent);
    }

    .card-top {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-value {
      font-size: clamp(28px, 3.8vw, 56px);
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 25px var(--accent-glow);
      line-height: 1.1;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .metric-label {
      font-size: clamp(12px, 1.2vw, 18px);
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 4px;
    }

    .card-desc {
      font-size: clamp(10px, 1vw, 14px);
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 14px;
    }

    /* Bottom Narrative / Subtitle */
    .narrative-box {
      font-size: clamp(12px, 1.35vw, 20px);
      font-weight: 500;
      color: #38bdf8;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 10px 24px;
      border-radius: 9999px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background-color: #38bdf8;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Animation State Classes */
    .active .badge-tag {
      opacity: 1;
      transform: translateY(0);
    }

    .active .main-heading {
      opacity: 1;
      transform: translateY(0);
    }

    .active .card-1 {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.4s;
    }

    .active .card-2 {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.65s;
    }

    .active .card-3 {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.9s;
    }

    .active .narrative-box {
      opacity: 1;
      transition-delay: 1.3s;
    }

    /* Controls Bar */
    .controls {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0369a1;
    }

    .progress-bar-container {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      transition: width 0.1s linear;
    }

    .time-label {
      font-size: 13px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="player-header">
    <div class="player-title">
      <span>Scene 004: Impact & Metrics</span>
      <span class="badge-live">Animated DSL</span>
    </div>
    <div style="font-size: 13px; color: #64748b;">1920 × 1080 (16:9) 60 FPS Mode</div>
  </div>

  <div class="stage-wrapper" id="stage">
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    <div class="grid-overlay"></div>

    <div class="scene-content" id="sceneContent">
      <div class="badge-tag">
        <span>◆</span>
        <span>PRODUCTION PERFORMANCE METRICS</span>
      </div>

      <h1 class="main-heading">
        動画制作の工数を90%削減し、公開速度を10倍へ
      </h1>

      <div class="cards-grid">
        <!-- Card 1 -->
        <div class="glass-card card-1" style="--accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.4);">
          <div class="card-top">
            <div class="metric-value" id="val1">0x</div>
            <div class="metric-label">制作スピードの向上</div>
          </div>
          <div class="card-desc">従来の3日間の手動カット・編集をわずか3分へ圧縮。音声投入から即座に完成。</div>
        </div>

        <!-- Card 2 -->
        <div class="glass-card card-2" style="--accent: #10b981; --accent-glow: rgba(16, 185, 129, 0.4);">
          <div class="card-top">
            <div class="metric-value" id="val2">0%</div>
            <div class="metric-label">編集コスト削減</div>
          </div>
          <div class="card-desc">無音・フィラー・言い直しをAIが自動カット。手動の手戻りを極小化。</div>
        </div>

        <!-- Card 3 -->
        <div class="glass-card card-3" style="--accent: #c084fc; --accent-glow: rgba(192, 132, 252, 0.4);">
          <div class="card-top">
            <div class="metric-value" id="val3">0.0%</div>
            <div class="metric-label">批評審査の合格率</div>
          </div>
          <div class="card-desc">Video Critic が映像・音声・文字切れを自動監査。常に高品質を維持。</div>
        </div>
      </div>

      <!-- Typewriter Subtitle Box -->
      <div class="narrative-box">
        <span id="typewriterText"></span><span class="cursor-blink"></span>
      </div>
    </div>
  </div>

  <!-- Player Controls -->
  <div class="controls">
    <button class="btn" id="playBtn" onclick="togglePlay()">
      <span id="playIcon">▶ 再生</span>
    </button>
    <button class="btn" style="background: rgba(255,255,255,0.08);" onclick="replay()">
      <span>↺ 最初から</span>
    </button>
    <div class="progress-bar-container" onclick="seek(event)">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="time-label" id="timeLabel">0.0s / 18.0s</div>
  </div>

  <script>
    const DURATION = 18.0;
    let currentTime = 0;
    let isPlaying = false;
    let animationFrameId = null;
    let lastTimestamp = null;

    const stage = document.getElementById('stage');
    const val1 = document.getElementById('val1');
    const val2 = document.getElementById('val2');
    const val3 = document.getElementById('val3');
    const typewriterText = document.getElementById('typewriterText');
    const progressBar = document.getElementById('progressBar');
    const timeLabel = document.getElementById('timeLabel');
    const playIcon = document.getElementById('playIcon');

    const fullMessage = "「自律型AIエージェントが、プロフェッショナルな品質基準で一気通貫に創り上げます」";

    function updateFrame(time) {
      progressBar.style.width = (time / DURATION * 100) + '%';
      timeLabel.textContent = time.toFixed(1) + 's / ' + DURATION.toFixed(1) + 's';

      // Stage Entrance Trigger
      if (time >= 0.2) {
        stage.classList.add('active');
      } else {
        stage.classList.remove('active');
      }

      // Countup Card 1 (starts at 1.1s, finishes at 1.9s)
      if (time >= 1.1) {
        const p = Math.min(1, (time - 1.1) / 0.8);
        const ease = 1 - Math.pow(1 - p, 3);
        val1.textContent = Math.round(ease * 10) + 'x';
      } else {
        val1.textContent = '0x';
      }

      // Countup Card 2 (starts at 1.4s, finishes at 2.2s)
      if (time >= 1.4) {
        const p = Math.min(1, (time - 1.4) / 0.8);
        const ease = 1 - Math.pow(1 - p, 3);
        val2.textContent = '-' + Math.round(ease * 92) + '%';
      } else {
        val2.textContent = '0%';
      }

      // Countup Card 3 (starts at 1.7s, finishes at 2.5s)
      if (time >= 1.7) {
        const p = Math.min(1, (time - 1.7) / 0.8);
        const ease = 1 - Math.pow(1 - p, 3);
        val3.textContent = (ease * 99.8).toFixed(1) + '%';
      } else {
        val3.textContent = '0.0%';
      }

      // Typewriter Effect (starts at 2.5s, ends at 5.5s)
      if (time >= 2.5) {
        const p = Math.min(1, (time - 2.5) / 3.0);
        const charCount = Math.floor(p * fullMessage.length);
        typewriterText.textContent = fullMessage.slice(0, charCount);
      } else {
        typewriterText.textContent = '';
      }
    }

    function loop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= DURATION) {
          currentTime = DURATION;
          isPlaying = false;
          playIcon.textContent = '▶ 再生';
        }
        updateFrame(currentTime);
        if (isPlaying) {
          animationFrameId = requestAnimationFrame(loop);
        }
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (currentTime >= DURATION) currentTime = 0;
        lastTimestamp = null;
        playIcon.textContent = '❚❚ 一時停止';
        animationFrameId = requestAnimationFrame(loop);
      } else {
        playIcon.textContent = '▶ 再生';
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      }
    }

    function replay() {
      currentTime = 0;
      lastTimestamp = null;
      updateFrame(0);
      if (!isPlaying) {
        togglePlay();
      }
    }

    function seek(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      currentTime = ratio * DURATION;
      updateFrame(currentTime);
    }

    // Auto-start on load
    window.onload = () => {
      replay();
    };
  </script>
</body>
</html>
